schema: 1
id: org.fleet.archiveextract
name: Archive Extract
description: Extract .zip and .rar archives under download roots.
version: 1.0.0
api: ">=1.0.0 <2.0.0"
engines:
  - rtorrent
capabilities:
  - torrents.read
  - files.unpack
  - storage.read
  - storage.write
frontend:
  type: declarative
  entry: ui/extension.json
backend:
  type: process
  executable: bin/archiveextract-worker
  protocol: jsonrpc-2
